<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>黑暗之魂3 · M1 垂直切片</title>
  <style>
    :root { --ember: #ff8c3a; --gold: #e6c37a; --cold: #8a93a6; --blood: #9b3b32; --stam: #7a8f4a; --bg: #0d1016; }
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    html, body { height: 100%; overflow: hidden; overscroll-behavior: none; touch-action: none; background: var(--bg); }
    body { font-family: "Noto Serif SC", "Songti SC", serif; color: #c9cdd4; }
    canvas { display: block; cursor: crosshair; touch-action: none; }

    #flash { position: fixed; inset: 0; pointer-events: none; opacity: 0; z-index: 40; }
    #vig { position: fixed; inset: 0; pointer-events: none; z-index: 5;
      background: radial-gradient(ellipse at center, transparent 55%, rgba(5,6,9,0.55) 100%); }

    /* ---- 左下：血条/精力/瓶/魂 ---- */
    .hud-bl { position: fixed; left: 22px; bottom: 20px; z-index: 10; width: min(340px, 38vw); }
    .bar { height: 11px; background: rgba(8,9,12,0.75); border: 1px solid rgba(230,195,122,0.28); margin-bottom: 6px; position: relative; }
    .bar i { position: absolute; inset: 1px; transform-origin: left; transition: none; }
    .bar.hp i { background: linear-gradient(180deg, #b04a3f, var(--blood)); }
    .bar.st { width: 78%; height: 8px; }
    .bar.st i { background: linear-gradient(180deg, #93a866, var(--stam)); }
    .meters { display: flex; gap: 18px; margin-top: 8px; font-size: 14px; letter-spacing: 1px; }
    .meters .flask { color: var(--gold); }
    .meters .flask b { font-size: 16px; margin-right: 4px; }
    .meters .souls { color: #9aa3b2; }
    .meters .souls b { color: #cfd6e2; font-weight: 500; }

    /* ---- 底中：Boss 条 ---- */
    #bossbar { position: fixed; left: 50%; bottom: 66px; transform: translateX(-50%); width: min(620px, 72vw); z-index: 10;
      opacity: 0; transition: opacity 0.8s; pointer-events: none; }
    #bossbar.on { opacity: 1; }
    #bossName { text-align: right; font-size: 17px; letter-spacing: 5px; color: #d8dee8; margin-bottom: 4px; text-shadow: 0 1px 4px #000; }
    #bossPhase2 { color: var(--ember); font-size: 12px; margin-left: 8px; opacity: 0; transition: opacity 0.6s; }
    #bossTry { text-align: right; font-size: 11.5px; letter-spacing: 3px; color: #6f7784; margin-top: 3px; }
    .bar.boss { height: 13px; }
    .bar.boss i.lag { background: #c9cdd4; }
    .bar.boss i.fill { background: linear-gradient(180deg, #c05a48, var(--blood)); }

    /* ---- 提示/消息/锁定 ---- */
    #prompt { position: fixed; left: 50%; bottom: 26%; transform: translateX(-50%); z-index: 10;
      font-size: 15px; letter-spacing: 2px; color: var(--gold); opacity: 0; transition: opacity 0.2s; text-shadow: 0 1px 3px #000; }
    #prompt.on { opacity: 1; }
    #msg { position: fixed; left: 50%; top: 30%; transform: translateX(-50%); z-index: 10;
      font-size: 26px; letter-spacing: 10px; text-indent: 10px; opacity: 0; text-shadow: 0 2px 8px #000; white-space: nowrap; }
    #lockon { display: none; position: fixed; z-index: 10; width: 14px; height: 14px; border: 1.6px solid var(--gold);
      transform: translate(-50%, -50%) rotate(45deg); box-shadow: 0 0 8px rgba(230,195,122,0.5); pointer-events: none; }

    /* ---- 操作提示 ---- */
    #hint { position: fixed; top: 16px; left: 20px; z-index: 10; font-size: 12.5px; line-height: 1.9; color: #6f7784;
      letter-spacing: 1px; transition: opacity 1.2s; }
    #hint.off { opacity: 0; }
    kbd { font-family: inherit; font-size: 11px; border: 1px solid #3a4048; border-radius: 3px; padding: 0 4px; color: #a8aeb8; margin: 0 1px; }
    #title { position: fixed; right: 18px; bottom: 14px; z-index: 10; font-size: 13px; letter-spacing: 2px; color: #5d6470; }
    #title b { color: var(--gold); font-weight: 600; }

    /* ---- 调校台（` 开关） ---- */
    #tune { position: fixed; top: 12px; right: 12px; width: 308px; max-height: calc(100vh - 24px); overflow-y: auto;
      background: rgba(9, 11, 15, 0.94); border: 1px solid #2c313a; z-index: 50; display: none;
      font: 11px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: #9aa3b2; padding: 10px 12px 14px; }
    #tune.on { display: block; }
    #tune h3 { font-size: 13px; letter-spacing: 4px; color: var(--gold); font-weight: 600; margin-bottom: 4px; }
    #tune hr { border: none; border-top: 1px solid #23272e; margin: 8px 0; }
    #tune details { margin-bottom: 2px; }
    #tune summary { cursor: pointer; color: #c9cdd4; letter-spacing: 2px; padding: 5px 0; user-select: none; }
    #tune summary:hover { color: var(--gold); }
    #tune .trow { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
    #tune .trow label { flex: 0 0 84px; white-space: nowrap; overflow: hidden; }
    #tune input[type="range"] { flex: 1; height: 3px; accent-color: #b8814a; cursor: ew-resize; }
    #tune .tval { flex: 0 0 52px; text-align: right; }
    #tune .tnum { width: 50px; background: #12151b; color: #c9cdd4; border: 1px solid #2c313a; padding: 1px 3px; font: inherit; }
    #tune select { background: #12151b; color: #c9cdd4; border: 1px solid #2c313a; padding: 2px 4px; font: inherit; flex: 1; }
    #tune .tbtn { background: #1a1e26; border: 1px solid #2c313a; color: #a8aeb8; padding: 3px 10px;
      font: inherit; cursor: pointer; margin-right: 4px; }
    #tune .tbtn:hover { border-color: var(--gold); color: var(--gold); }
    #tune input[type="checkbox"] { accent-color: #b8814a; }

    /* ---- 覆盖层 ---- */
    .overlay { position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at center, rgba(5,6,9,0.55) 0%, rgba(3,4,6,0.92) 100%);
      opacity: 0; pointer-events: none; transition: opacity 1.1s; }
    .overlay.show { opacity: 1; }
    .overlay .big { font-size: clamp(64px, 12vw, 130px); letter-spacing: 0.35em; text-indent: 0.35em; font-weight: 600; }
    #overlayDeath .big { color: var(--blood); text-shadow: 0 0 42px rgba(155,59,50,0.65); }
    #overlayWin .big { color: var(--gold); font-size: clamp(42px, 7vw, 76px); text-shadow: 0 0 38px rgba(230,195,122,0.5); }
    .overlay .sub { margin-top: 26px; font-size: 15px; letter-spacing: 3px; color: #7d8490; }
    .overlay .sub b { color: #b8bfc9; font-weight: 500; }
    #winStats { margin-top: 14px; font-size: 14px; letter-spacing: 2px; color: #8a93a6; }

    /* ---- 篝火菜单（M2：休息/传送/再战） ---- */
    #bonfireMenu { z-index: 35; }

    /* ---- 传送演出（M4 T9：黑场渐隐 + 区域题字卡） ---- */
    #fade { position: fixed; inset: 0; background: #050608; opacity: 0; pointer-events: none; z-index: 60;
      transition: opacity 0.3s ease; }
    #fade.on { opacity: 1; }
    #zoneCard { position: fixed; left: 50%; top: 38%; transform: translateX(-50%); z-index: 61; pointer-events: none;
      font-size: clamp(30px, 4.6vw, 44px); letter-spacing: 18px; text-indent: 18px; color: #d8dee8;
      text-shadow: 0 2px 14px rgba(0,0,0,0.9), 0 0 38px rgba(230,195,122,0.18);
      opacity: 0; transition: opacity 0.9s ease 0.15s; white-space: nowrap; }
    #zoneCard.on { opacity: 1; }
    #bonfireMenu .fire { font-size: 30px; letter-spacing: 12px; color: var(--gold); text-shadow: 0 0 26px rgba(230,195,122,0.45); margin-bottom: 34px; }
    #menuItems { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    #menuItems .mi { font-size: 19px; letter-spacing: 7px; text-indent: 7px; color: #8a93a6; padding: 7px 34px;
      transition: color 0.15s; }
    #menuItems .mi.sel { color: var(--gold); text-shadow: 0 0 14px rgba(230,195,122,0.5); }
    #menuItems .mi.off { opacity: 0.32; }
    #menuHint { margin-top: 30px; font-size: 13px; letter-spacing: 3px; color: #5d6470; }
  </style>
</head>
<body>
  <div id="vig"></div>
  <div id="flash"></div>
  <div id="fade"></div>
  <div id="zoneCard"></div>

  <div class="hud-bl">
    <div class="bar hp"><i id="hpFl"></i></div>
    <div class="bar st"><i id="stFl"></i></div>
    <div class="meters">
      <span class="flask"><b id="estusN">3</b>原素瓶 <kbd>R</kbd></span>
      <span class="souls">魂 <b id="soulN">0</b></span>
    </div>
  </div>

  <div id="bossbar">
    <div id="bossName"><span id="bossTitle">灰烬审判者古达</span><span id="bossPhase2">· 人性的沉淀</span></div>
    <div class="bar boss"><i class="lag" id="bossLag"></i><i class="fill" id="bossFill"></i></div>
    <div id="bossTry"></div>
  </div>

  <div id="prompt"></div>
  <div id="msg"></div>
  <div id="lockon"></div>

  <div id="hint">
    <kbd>W A S D</kbd>移动 <kbd>Shift</kbd>疾跑 <kbd>空格</kbd>翻滚(无敌帧)<br/>
    <kbd>左键</kbd>轻击·按住蓄力重击 <kbd>右键</kbd>格挡 <kbd>F</kbd>弹反<br/>
    <kbd>E</kbd>交互/处决 <kbd>Q</kbd>锁定 <kbd>R</kbd>原素瓶 <kbd>M</kbd>静音<br/>
    视角默认全自动（跟背/开战锁定）；鼠标用户按 <kbd>V</kbd> 自由视角·滚轮缩放，<kbd>Esc</kbd> 退出<br/>
    调校台 <kbd>`</kbd>（帧数据热调/判定可视化）· <kbd>T</kbd>慢动作 <kbd>P</kbd>暂停 <kbd>→</kbd>逐帧
  </div>
  <div id="title"><b>黑暗之魂3</b> · M1 垂直切片</div>

  <div class="overlay" id="overlayDeath">
    <div class="big">你死了</div>
    <div class="sub">魂尚在灰烬中回响 —— <b>R</b> 回到篝火</div>
  </div>
  <div class="overlay" id="overlayWin">
    <div class="big" id="winBig">古达 已陨落</div>
    <div class="sub" id="winSub">螺旋剑已入手 · 魂 +3000</div>
    <div id="winStats"></div>
    <div class="sub"><b>R</b> 回到篝火</div>
  </div>
  <div class="overlay" id="bonfireMenu">
    <div class="fire">✦ 篝 火 ✦</div>
    <div id="menuItems"></div>
    <div id="menuHint">↑↓ 选择 · E 确认 · Esc 离开</div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
