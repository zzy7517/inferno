<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inferno · M0 管线验证</title>
  <style>
    :root { --ember: #ff8c3a; --gold: #e6c37a; --cold: #8a93a6; --bg: #0d1016; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: var(--bg); }
    body { font-family: "Noto Serif SC", "Songti SC", serif; color: #c9cdd4; }
    canvas { display: block; }

    #hud { position: fixed; inset: 0; pointer-events: none; }
    #title {
      position: absolute; right: 18px; bottom: 14px;
      font-size: 13px; letter-spacing: 2px; color: #5d6470;
    }
    #title b { color: var(--gold); font-weight: 600; }
    #legend {
      position: absolute; left: 18px; bottom: 14px;
      font-size: 12px; color: #6b7280; letter-spacing: 1px;
    }
    kbd {
      font-family: inherit; font-size: 11px; border: 1px solid #3a4048;
      border-radius: 3px; padding: 0 4px; color: #a8aeb8; margin: 0 1px;
    }
    #phase {
      position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
      font-size: 22px; letter-spacing: 6px; text-indent: 6px;
      color: var(--cold); transition: color 80ms linear;
    }
    #phase.active { color: var(--ember); }
    #phase.iframe { color: var(--gold); }
    #debug {
      position: absolute; top: 16px; left: 18px;
      font-family: ui-monospace, Menlo, monospace; font-size: 12px;
      line-height: 1.7; color: #7d8490; white-space: pre;
    }
    #debug b { color: #c9cdd4; font-weight: 500; }
  </style>
</head>
<body>
  <div id="hud">
    <div id="phase">待机</div>
    <div id="debug"></div>
    <div id="legend">
      <kbd>左键</kbd>轻击 <kbd>空格</kbd>翻滚·后摇55%后可取消 <kbd>T</kbd>慢动作0.25× <kbd>R</kbd>复位
    </div>
    <div id="title"><b>INFERNO</b> · M0 管线验证</div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
